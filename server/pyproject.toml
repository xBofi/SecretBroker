[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretbroker-server"
version = "0.15.0"
description = "Zero-knowledge sync and sharing server for SecretBroker teams"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.scripts]
secretbroker-server = "secretbroker_server.cli:main"

[tool.setuptools]
packages = ["secretbroker_server"]
