# Builds, signs and publishes the installer when a version tag (v0.8.0) is pushed.
# The installed app finds it through the GitHub Releases API and verifies the signature.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tag and version must match
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "La etiqueta $env:GITHUB_REF_NAME no coincide con la versión $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install SecretBroker
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --disable-pip-version-check --quiet .

      - name: Tests
        run: .venv\Scripts\python.exe tests\test_e2e.py

      - name: Build installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\build_installer.ps1

      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: .venv\Scripts\python.exe tools\sign_release.py

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = "dist\SecretBroker-Setup-$env:VERSION.exe"
          gh release create $env:GITHUB_REF_NAME $exe "$exe.sig" --title "SecretBroker $env:VERSION" --generate-notes

  # The Ubuntu package, signed the same way, added to the release the job above created.
  ubuntu:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils dpkg-dev curl libnss3 libxkbcommon0 libxkbcommon-x11-0 libegl1 libgl1 \
            libopengl0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxshmfence1 libxkbfile1 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Build the .deb
        run: bash tools/build_deb.sh

      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          python -m pip install --disable-pip-version-check --quiet cryptography httpx
          python tools/sign_release.py dist/secretbroker_*_amd64.deb

      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/secretbroker_*_amd64.deb dist/secretbroker_*_amd64.deb.sig
