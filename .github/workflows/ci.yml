# Runs the tests on every push to main and every pull request.
# Releases are built and signed separately by release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The desktop app's suites (no GUI) on each system. tests/test_gui.py needs a real desktop and runs before releases.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The macOS port is not finished (TODO(macos) in secretbroker/platform/macos.py): informative until it is.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: System libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpam0g

      - name: Install SecretBroker
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install --disable-pip-version-check --quiet ".[dev]"
          if [ -f server/pyproject.toml ]; then $PY -m pip install --disable-pip-version-check --quiet -e server; fi

      - name: Platform layer
        run: $PY tests/test_platform.py

      - name: End-to-end tests
        run: $PY tests/test_e2e.py

      - name: Personal tests
        run: $PY tests/test_personal.py

      - name: Exposure tests
        run: $PY tests/test_exposure.py

      - name: Team tests
        run: $PY tests/test_teams.py

  # Builds the Ubuntu package, installs it on the runner and checks that the service starts as `secretbroker`.
  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils dpkg-dev curl libnss3 libxkbcommon0 libxkbcommon-x11-0 libegl1 libgl1 \
            libopengl0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxshmfence1 libxkbfile1 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Build the .deb
        run: bash tools/build_deb.sh

      - name: Install it and check the service
        run: |
          sudo apt-get install -y -qq ./dist/secretbroker_*_amd64.deb
          sleep 5
          systemctl is-active "secretbroker@$USER.service"
          test "$(ps -o user= -p "$(systemctl show -p MainPID --value "secretbroker@$USER.service")")" = secretbroker
          stat -c '%U:%G %a' "/var/lib/secretbroker/$USER/data" "/var/lib/secretbroker/$USER/public/broker.json"
          /opt/secretbroker/venv/bin/python -I -c "from secretbroker import client, paths; assert paths.is_installed(); print(client.request('status')['state'])"
          sudo apt-get purge -y -qq secretbroker
          test ! -e /var/lib/secretbroker

      - uses: actions/upload-artifact@v4
        with:
          name: secretbroker-deb
          path: dist/secretbroker_*_amd64.deb
          retention-days: 7

  linux-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the server
        run: |
          if [ -f server/pyproject.toml ]; then
            python -m pip install --disable-pip-version-check --quiet -e server httpx
          else
            echo "server/ not present, skipped"
          fi

      - name: Server tests
        run: |
          if [ -f server/tests/test_server.py ]; then
            python server/tests/test_server.py
          else
            echo "server/tests/test_server.py not present, skipped"
          fi

      - name: Docker image
        run: |
          if [ -f server/Dockerfile ]; then
            docker build -t secretbroker-server:ci server/
          else
            echo "server/Dockerfile not present, skipped"
          fi
