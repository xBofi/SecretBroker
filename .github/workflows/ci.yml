# Runs the tests on every push to main and every pull request.
# Releases are built and signed separately by release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # a branch's run before opening a pull request

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The desktop app's suites (no GUI) on each system. tests/test_gui.py runs on Ubuntu below (desktop-gui-ubuntu)
  # and on Windows before releases (it needs a real desktop there).
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: System libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpam0g

      - name: Install SecretBroker
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install --disable-pip-version-check --quiet ".[dev]"
          if [ -f server/pyproject.toml ]; then $PY -m pip install --disable-pip-version-check --quiet -e server; fi

      - name: Platform layer
        run: $PY tests/test_platform.py

      - name: Translations
        run: $PY tools/check_locales.py
        env:
          PYTHONIOENCODING: utf-8

      - name: End-to-end tests
        run: $PY tests/test_e2e.py

      - name: Personal tests
        run: $PY tests/test_personal.py

      - name: Exposure tests
        run: $PY tests/test_exposure.py

      - name: Team tests
        run: $PY tests/test_teams.py

      - name: Browser autofill tests
        run: $PY tests/test_autofill.py

  # tests/test_gui.py on Ubuntu: the real app (QtWebEngine) on a virtual display with a window manager and an icon
  # area next to the clock, driven through the DevTools Protocol. The screenshots are kept to look at.
  desktop-gui-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpam0g libnss3 libxkbcommon0 libxkbcommon-x11-0 libegl1 libgl1 \
            libopengl0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxshmfence1 libxkbfile1 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            xvfb openbox stalonetray xclip fonts-noto-core fonts-noto-cjk

      - name: Install SecretBroker
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --quiet ".[dev]"
          .venv/bin/python -m pip install --disable-pip-version-check --quiet -e server

      - name: Desktop app (tests/test_gui.py)
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            openbox & stalonetray --geometry 4x1+1400+0 & sleep 2
            .venv/bin/python tests/test_gui.py'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: gui-screenshots-ubuntu
          path: |
            /tmp/secretbroker-gui-*/screenshots/*.png
            /tmp/secretbroker-gui-*/user/app.log
          retention-days: 7

  # Builds the Ubuntu package, installs it on the runner and checks that the service starts as `secretbroker`.
  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils dpkg-dev curl libnss3 libxkbcommon0 libxkbcommon-x11-0 libegl1 libgl1 \
            libopengl0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxshmfence1 libxkbfile1 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Build the .deb
        run: bash tools/build_deb.sh

      - name: Install it and check the service
        run: |
          sudo apt-get install -y -qq ./dist/secretbroker_*_amd64.deb
          sleep 5
          systemctl is-active "secretbroker@$USER.service"
          test "$(ps -o user= -p "$(systemctl show -p MainPID --value "secretbroker@$USER.service")")" = secretbroker
          stat -c '%U:%G %a' "/var/lib/secretbroker/$USER/data" "/var/lib/secretbroker/$USER/public/broker.json"
          /opt/secretbroker/venv/bin/python -I -c "from secretbroker import client, paths; assert paths.is_installed(); print(client.request('status')['state'])"
          sudo apt-get purge -y -qq secretbroker
          test ! -e /var/lib/secretbroker

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: secretbroker-deb
          path: dist/secretbroker_*_amd64.deb
          retention-days: 7

  # Builds the macOS package (unsigned), installs it on the runner and checks that the service runs as `_secretbroker`
  # and that the desktop account, and only it, can read broker.json.
  macos-package:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Build the .pkg
        run: bash tools/build_macos.sh

      - name: Install it and check the service
        run: |
          sudo installer -pkg dist/SecretBroker-*-macos-arm64.pkg -target /
          sleep 10
          dscl . -read /Users/_secretbroker UniqueID IsHidden
          sudo launchctl print "system/com.secretbroker.service.$USER" | grep -E 'state|pid'
          test "$(ps -o user= -p "$(pgrep -f "secretbroker.service --isolated --root .*/$USER --owner")" | tr -d ' ')" = _secretbroker
          root="/Library/Application Support/SecretBroker/$USER"
          ls -le "$root" "$root/public"
          test "$(stat -f '%Su %Lp' "$root/data")" = "_secretbroker 700"
          ! sudo -u nobody cat "$root/public/broker.json" 2>/dev/null
          /Applications/SecretBroker.app/Contents/Resources/python/bin/python3 -I -c "from secretbroker import client, paths; assert paths.is_installed(); print(client.request('status')['state'])"
          # Root and the service never run code from /Applications (an admin's programs can replace it).
          test "$(stat -f '%Su %Lp' /Library/PrivilegedHelperTools/com.secretbroker.setup)" = "root 755"
          test "$(stat -f '%Su' "/Library/Application Support/SecretBroker/.runtime/python/bin/python3")" = root
          pgrep -f "SecretBroker/.runtime/python/bin/python3 -I -m secretbroker.service" >/dev/null
          test -L /usr/local/bin/sb && test -f "$HOME/Library/Application Support/Google/Chrome/NativeMessagingHosts/com.secretbroker.autofill.json"

      # WKWebView has no DevTools Protocol, so tests/test_gui.py can't drive it: a smoke check of the installed app
      # as the logged-in user instead. The page polls the service's status as the GUI (gui_connected), so that is
      # true only once WKWebView has loaded the page and its JavaScript reached the service through the app.
      - name: Desktop app smoke check (macOS)
        run: |
          PY=/Applications/SecretBroker.app/Contents/Resources/python/bin/python3
          log="$HOME/Library/Application Support/SecretBroker/app/app.log"
          pgrep -u "$USER" -f "secretbroker.app" >/dev/null || open -a SecretBroker
          for i in $(seq 1 60); do
            $PY -I -c "from secretbroker import client; import sys; sys.exit(0 if client.request('status')['gui_connected'] else 1)" && break
            sleep 2
          done
          $PY -I -c "from secretbroker import client; s = client.request('status'); print(s['state'], s['gui_connected']); assert s['gui_connected']"
          cat "$log"
          grep -q "tray icon: ok" "$log" && grep -q "MCP over HTTP: ok" "$log" && ! grep -q "ERROR" "$log"
          # A vault, so that the page shows its main screen, and `sb` reaches the service with the user's token.
          $PY -I -c "from secretbroker import client; r = client.request('create_vault', {'master_password': 'smoke test password 123'}); print(sorted(r))"
          mkdir -p /tmp/sb-smoke && cd /tmp/sb-smoke && printf 'DEMO_KEY = demo-key\n' > .secretbroker
          set +e; out=$(sb check 2>&1); code=$?; set -e
          echo "$out"
          test "$code" = 1 && echo "$out" | grep -q "DEMO_KEY = demo-key"
          sleep 5
          screencapture -x "$RUNNER_TEMP/macos-app.png"
          osascript -e 'tell application "SecretBroker" to quit' || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: macos-app-screenshot
          path: ${{ runner.temp }}/macos-app.png
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: secretbroker-pkg
          path: dist/SecretBroker-*-macos-*.pkg
          retention-days: 7

  linux-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the server
        run: |
          if [ -f server/pyproject.toml ]; then
            python -m pip install --disable-pip-version-check --quiet -e server httpx
          else
            echo "server/ not present, skipped"
          fi

      - name: Server tests
        run: |
          if [ -f server/tests/test_server.py ]; then
            python server/tests/test_server.py
          else
            echo "server/tests/test_server.py not present, skipped"
          fi

      - name: Docker image
        run: |
          if [ -f server/Dockerfile ]; then
            docker build -t secretbroker-server:ci server/
          else
            echo "server/Dockerfile not present, skipped"
          fi
