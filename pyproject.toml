[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretbroker"
version = "0.15.0"
description = "Local secret broker: lets AI agents use credentials without ever reading them"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "paramiko>=3.4",
    "pynacl>=1.5",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pywebview>=5",
    "winrt-runtime>=3; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3; sys_platform == 'win32'",
    "winrt-Windows.Security.Credentials>=3; sys_platform == 'win32'",
    "winrt-Windows.Security.Cryptography>=3; sys_platform == 'win32'",
    "winrt-Windows.Security.Cryptography.Core>=3; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3; sys_platform == 'win32'",
    # Linux: pywebview's Qt backend (window, tray icon, clipboard) and the Secret Service keyring
    "QtPy>=2.4; sys_platform == 'linux'",
    "PyQt6>=6.6; sys_platform == 'linux'",
    "PyQt6-WebEngine>=6.6; sys_platform == 'linux'",
    "secretstorage>=3.3; sys_platform == 'linux'",
    # macOS: pywebview's Cocoa backend, the menu bar icon, the Keychain and Touch ID, the account password
    # (Open Directory) and the lock screen. Imported only on macOS (see secretbroker/platform/macos.py).
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Security>=10; sys_platform == 'darwin'",
    "pyobjc-framework-LocalAuthentication>=10; sys_platform == 'darwin'",
    "pyobjc-framework-OpenDirectory>=10; sys_platform == 'darwin'",
    "pystray>=0.19.5; sys_platform == 'darwin'",
    "Pillow>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["websocket-client>=1.7"]  # tests/test_gui.py drives the app's page

[project.scripts]
sb = "secretbroker.cli:main"
secretbroker-mcp = "secretbroker.mcp_server:main"
secretbroker-service = "secretbroker.service:main"

[project.gui-scripts]
secretbroker = "secretbroker.app:main"

[tool.setuptools]
packages = ["secretbroker", "secretbroker.platform"]

[tool.setuptools.package-data]
secretbroker = ["web/*", "assets/*", "data/*"]
