[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretbroker"
version = "0.7.0"
description = "Local secret broker: lets AI agents use credentials without ever reading them"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "paramiko>=3.4",
    "pynacl>=1.5",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pywebview>=5",
    "winrt-runtime>=3; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3; sys_platform == 'win32'",
    "winrt-Windows.Security.Credentials>=3; sys_platform == 'win32'",
    "winrt-Windows.Security.Cryptography>=3; sys_platform == 'win32'",
    "winrt-Windows.Security.Cryptography.Core>=3; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3; sys_platform == 'win32'",
]

[project.scripts]
sb = "secretbroker.cli:main"
secretbroker-mcp = "secretbroker.mcp_server:main"
secretbroker-service = "secretbroker.service:main"

[project.gui-scripts]
secretbroker = "secretbroker.app:main"

[tool.setuptools]
packages = ["secretbroker"]

[tool.setuptools.package-data]
secretbroker = ["web/*", "assets/*"]
